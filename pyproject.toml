[project]
name = "mimir-decide"
version = "0.1.0"
description = "Continual training of DFM Mimir (HRM-Text) into a Jev-like decision model"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=5.13",
  "datasets>=3.0",
  "huggingface_hub>=0.30",
  "pyarrow>=16",
  "numpy",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["mimir_decide*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs network access"]
