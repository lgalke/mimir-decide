# Data mixture v1 (D31): larger and more diverse training set, evaluation frozen to mixture-v0.
# Build: python -m mimir_decide.build_mixture --config configs/data_v1.yaml    (hours; network; never together with another build into the same folder)
seed: 0
output_dir: "{DATA_ROOT}/mixture-v1"
cache_dir: "{DATA_ROOT}/cache"

# --- evaluation is frozen: the same filters, caps and seeds as configs/data.yaml; the build fails if any written eval file differs from mixture-v0
frozen_eval_from: "{DATA_ROOT}/mixture-v0"
max_state_chars: 12000          # v0 value; the eval pass uses it
eval_max_state_chars: 12000
max_options: 26                 # letters A-Z for the baseline; larger option sets are subsampled (gold kept)
eval_caps:
  validation_per_source: 100
  test_per_source: 300
  heldout_per_source: 300
guard_long_eval_states: true    # eval states removed by the length filter above still guard the (longer) train rows
held_out_sources:
  - "massive/nb-NO"
exclude_sources_from:           # E12 extra evaluation sources must stay unseen
  - configs/extra_eval_sources.yaml
ngram_boilerplate_df: 3

# --- training side
train_max_state_chars: 16000    # about 4000 tokens (context 4096); the formatter still cuts the middle of a longer state
license_strip_annotations: true # D32: "(original source)" / "(publisher)" after a permissive licence are ignored (train pass only)
per_source_cap: 20000           # the dataset's own collection budget
read_limit_per_source: 60000    # bekko dropped 1.9M rows by this limit in v0 (20000)
max_total_train: 3000000        # only used by the legacy path (no `sampling` section)
sampling_alpha: 0.5

sampling:
  alpha: 0.5                    # quota_s = min(n_s, c * n_s**alpha, max_source_share * N)
  total: 2000000                # target size of the full set; smaller when the pool after the guards is smaller
  max_source_share: 0.01
  families:                     # family = dataset unless a pattern matches
    procedural: "tasksource/procedural-typed-decisions/*"
  family_caps: {procedural: 0.10, bekko: 0.25}
  kind_floors: {noul: 0.20, score: 0.15}   # v0: noul 16.7%, score 10.2%
  max_binary_share: 0.40
  sizes:                        # nested subsets of the full set, written as train_<name>.parquet
    v1-371k: 371275             # the size of mixture-v0: isolates composition from size
    v1-1M: 1000000

sources:
  tasksource:
    enabled: true
    revision: d2ab1d12be4463fb7ac1f877ed2193b3bb59642a   # same revision as v0
    streaming: true
    config: full                # train rows from the larger pool (2.5M at this revision)
    eval_config: default        # validation/test from `default`, as in v0 (keeps the eval files identical)
    guard_eval_configs: [full]  # `full` eval rows are hashed for the guards, never written
  bekko:
    enabled: true
    revision: 5f67e4e2fd2542e2fc3f82d86d7c3be705bda7b9
    accept_qualified: false
    write_test: false
  localllama:
    enabled: true
    revision: d0e2f0c42fef86cc15d1688d25a19f5ba7c85b18
  massive:
    enabled: true
    locales: [da-DK, en-US, sv-SE, nb-NO, de-DE]
    n_options: 8
  helpsteer2:
    enabled: true
    revision: 990b2711a36180dd19d9c94b8627844866f8982a
