# Scalar per-option head on mixture-v1 (D33, E17) on Mimir v1.5. Single GPU (>=40 GB recommended; ~80 GB comfortable).
model_type: scalar
base_model: danish-foundation-models/DFM-Mimir-v1.5
revision: 521b40b36a79918014544b970d4c2669ff1530eb
data_dir: "{DATA_ROOT}/mixture-v1"   # DATA_ROOT = $MIMIR_DECIDE_DATA, default ~/mimir-decide-data
run_dir: runs/scalar-v1-371k   # relative to the repository root; git tracks only the small result files (see .gitignore)

train_file: train_v1-371k.parquet   # nested subset of mixture-v1; train.parquet is the full set
max_len: 4096                # v1: the model's limit (v0 used 2048)
batch_size: 2                # decisions per micro-batch; every decision is K rows (K = options, at most max_train_options for choice), so check with mem_probe --options 6
grad_accum: 16               # effective batch stays 32 decisions
epochs: 1
max_steps: null
lr_backbone: 1.0e-5          # v1.5's final LR was 1e-5
lr_head: 1.0e-4
lr_cycle_dividers: false     # true: L stack lr / (L applications with gradient, 6 for [3,3]), H stack lr / H_cycles (2); false reproduces the runs so far (D30)
weight_decay: 0.01
warmup_frac: 0.01
grad_clip: 1.0
emd_lambda: 0.5
L_bp_cycles: null            # keep the checkpoint's [3, 3]; [0, 3] saves memory/compute (a deviation)
freeze_input_embeddings: true
gradient_checkpointing: true
param_dtype: float32         # fp32 master weights + bf16 autocast on CUDA
eval_every: 1000
eval_max_examples: 2000
eval_batch_size: 4           # evaluation uses all options of a decision as rows
log_every: 10
num_workers: 2
seed: 0
gpu_memory_fraction: null    # for a run that shares the GPU with another: for example 0.40 (about 38 GB of 95 GB), so that this run fails alone instead of taking the other run's memory
max_train_options: 6         # scalar head: rows per choice decision in training (all options with target mass + sampled negatives, sampled-softmax correction)
